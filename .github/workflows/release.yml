name: Prepare release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Require a release version
        run: |
          $replayVersion = python -c "import sys; sys.path.insert(0, 'src'); from version import VERSION; print(VERSION)"
          if ($replayVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'Development builds must not be published as releases.' }
      - run: ./scripts/build.ps1
      - run: python scripts/package_release.py
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $replayReleaseFiles = @((Get-ChildItem release -File -Filter '*.zip').FullName) + @('release/SHA256SUMS.txt') + @((Get-ChildItem release/third-party-sources -File -Filter '*.tar.xz').FullName)
          $replayVersion = python -c "import sys; sys.path.insert(0, 'src'); from version import VERSION; print(VERSION)"
          gh release create "v$replayVersion" --draft --target $env:GITHUB_SHA --title "$replayVersion Release" --notes-file RELEASE_NOTES.md @replayReleaseFiles
