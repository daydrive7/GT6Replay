name: Prepare release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - run: ./scripts/build.ps1
      - run: python scripts/package_release.py
      - name: Create draft 0.1.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $replayReleaseFiles = @((Get-ChildItem release -File -Filter '*.zip').FullName) + @('release/SHA256SUMS.txt') + @((Get-ChildItem release/third-party-sources -File -Filter '*.tar.xz').FullName)
          gh release create v0.1.0 --draft --target $env:GITHUB_SHA --title '0.1.0 Release' --notes-file RELEASE_NOTES.md @replayReleaseFiles
